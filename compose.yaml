services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fias
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data

  fias.api:
    image: fias.api
    build:
      context: .
      dockerfile: Fias.Api/Dockerfile
    depends_on: [postgres]
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=fias;Username=postgres;Password=secret"
    ports:
      - "8080:8080"

  fias.service.updater:
    image: fias.service.updater
    build:
      context: .
      dockerfile: Fias.Service.Updater/Dockerfile
    depends_on: [postgres]
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=fias;Username=postgres;Password=secret"
      Fias__ImportDirectory: "/fias/import"
    volumes:
      # Локальная папка для подкладывания gar_xml.zip "под ноги" воркеру.
      - ./fias-import:/fias/import

volumes:
  postgres-data:
